reviews:
  request_changes_workflow: false
  high_level_summary: true
  path_filters:
    # ❌ BLOKIR TOTAL FILE LOKALISASI, STATIS & CONFIG
    - "!**/*.json"
    - "!**/*.html"
    - "!**/*.txt"
    - "!**/*.mjs"
    - "!**/*.css"
    - "!**/public/**"      # Ini bakal bantai semua folder public & locales
    - "!**/e2e/**"         # Bantai semua file testing
    - "!**/scripts/**"
    
    # ❌ BLOKIR CONFIGURATION FILES
    - "!**/eslint.config.js"
    - "!**/playwright.config.ts"
    - "!**/vite.config.ts"
    - "!**/nginx.conf"
    - "!**/Dockerfile"

    # ❌ BLOKIR KOMPONEN UI & PAGES (CUMA BIKIN PENUH KUOTA)
    - "!**/src/components/**"
    - "!**/src/pages/**"
    - "!**/src/App.tsx"
    - "!**/src/main.tsx"
    - "!**/src/SetupTests.ts"
    - "!**/src/vite-env.d.ts"

    # ✅ FOKUS HANYA KE CORE BUSINESS LOGIC & CRYPTO
    - "**/packages/shared/src/**"
    - "**/web/src/lib/**"
    - "**/web/src/store/**"
    - "**/web/src/utils/**"
    - "**/web/src/workers/**"
    - "**/web/src/hooks/**"
    - "**/web/src/sw.ts"
